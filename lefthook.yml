pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run scripts/lint-ratchet.ts --staged
    guardrails:
      run: bun run scripts/check-guardrails.ts --staged

pre-push:
  parallel: true
  commands:
    types:
      run: NODE_OPTIONS=--max-old-space-size=4096 bun run typecheck
    guardrails:
      run: bun run scripts/check-guardrails.ts --with-boundaries
