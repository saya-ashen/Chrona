version: 1

document:
  file_suffix: ".feature.md"
  module_file_name: "MODULE.feature.md"
  front_matter_required: true

source:
  include_globs:
    - "apps/**/*.ts"
    - "apps/**/*.tsx"
    - "packages/**/*.ts"
    - "packages/**/*.tsx"
    - "external-plugins/**/*.ts"
  exclude_globs:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.bun.test.ts"
    - "**/*.spec.ts"
    - "**/dist/**"
    - "**/generated/**"
    - "**/node_modules/**"

exclude:
  path_globs:
    - "**/index.ts"
    - "**/index.tsx"
  symbol_kinds:
    - "type"
    - "interface"
  symbol_name_patterns:
    - "^_"
    - "Props$"
    - "State$"

score:
  exported: 3
  route_handler: 3
  engine_use_case: 3
  writes_database: 3
  emits_event: 2
  rebuilds_projection: 2
  provider_boundary: 2
  graph_transition: 2
  public_component: 2
  has_direct_tests: 1
  internal_helper: -2
  type_only: -4
  barrel_export: -4

# AI-owned allowlist. Default mode is explicit: no source file is documented
# until an AI/human reviews a scoped area and writes chosen files/symbols here.
# Use `bun run feature-docs:select --path <area>` to print candidate YAML,
# then keep only entries worth documenting.
selection:
  mode: "explicit"
  files:
    - path: "packages/engine/src/modules/tasks/accept-task-result.ts"
      reason: "pilot-task-management-result-flow"
      symbols:
        - "acceptTaskResult"
    - path: "packages/engine/src/modules/tasks/create-task.ts"
      reason: "pilot-task-management-create-use-case"
      symbols:
        - "createTask"
    - path: "packages/engine/src/modules/tasks/delete-task.ts"
      reason: "pilot-task-management-delete-use-case"
      symbols:
        - "deleteTask"
    - path: "packages/engine/src/modules/tasks/get-task-page.ts"
      reason: "pilot-task-management-page-read-model"
      symbols:
        - "getTaskPage"
    - path: "packages/engine/src/modules/tasks/list-tasks.ts"
      reason: "pilot-task-management-list-use-case"
      symbols:
        - "listTasksByWorkspace"
    - path: "packages/engine/src/modules/tasks/mark-task-done.ts"
      reason: "pilot-task-management-lifecycle-use-case"
      symbols:
        - "markTaskDone"
    - path: "packages/engine/src/modules/tasks/reopen-task.ts"
      reason: "pilot-task-management-lifecycle-use-case"
      symbols:
        - "reopenTask"
    - path: "packages/engine/src/modules/tasks/task-activity.ts"
      reason: "pilot-task-management-activity-events"
      symbols:
        - "buildActivityTimeline"
        - "getTaskActivityPage"
    - path: "packages/engine/src/modules/tasks/update-task.ts"
      reason: "pilot-task-management-update-use-case"
      symbols:
        - "updateTask"

describe_threshold: 5
