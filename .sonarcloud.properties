# SonarQube Cloud Automatic Analysis ignores sonar-project.properties.
# Keep generated contracts, migrations, and test/evidence code out of source quality gates.
sonar.exclusions=packages/db/src/generated/**,prisma/migrations/**,.specify/**,external-plugins/**,e2e/**,**/__tests__/**,**/tests/**,**/test-support/**,**/*.test.ts,**/*.test.tsx,**/*.bun.test.ts
sonar.cpd.exclusions=packages/db/src/generated/**,prisma/migrations/**,.specify/**,external-plugins/**,e2e/**,**/__tests__/**,**/tests/**,**/test-support/**,**/*.generated.*,**/__generated__/**,**/*.test.ts,**/*.test.tsx,**/*.bun.test.ts
sonar.coverage.exclusions=packages/db/src/generated/**,prisma/migrations/**,.specify/**,external-plugins/**,e2e/**,**/__tests__/**,**/tests/**,**/test-support/**,**/*.test.ts,**/*.test.tsx,**/*.bun.test.ts
