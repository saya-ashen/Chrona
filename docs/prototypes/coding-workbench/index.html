<script>

html+=(messages[current]||[]).map(x=>msg(x.who,x.html,'刚刚')).join('');if(w.state==='stopping')html='<div class="notice">已请求停止，尚未确认。工作文件和成果会保留；确认前不应重新执行或清理工作目录。</div>'+html;if(w.state==='stopped')html='<div class="notice">执行已停止。已有成果已保留，可以检查后再决定下一步。</div>'+html;return html}
const files=['workbench.ts','progress.ts','progress.test.ts'];const diffs=[['  async function readProgress(workId) {','-   const page = await events({ workId, limit: 100 });','-   return page.events;','+   const page = await events({ workId, after: cursor, limit: 100 });','+   mergeBySequence(history, page.events);','+   cursor = page.nextCursor;','+   return { events: history, gap: page.gap };','  }'],['  function mergeBySequence(history, incoming) {','+   const seen = new Set(history.map(event => event.seq));','+   for (const event of incoming) {','+     if (!seen.has(event.seq)) history.push(event);','+   }','+   history.sort((a, b) => a.seq - b.seq);','  }'],['+ test("刷新后接续进度，不重复已有记录", async () => {','+   const result = await resumeFromCursor(100);','+   expect(result.events[0].seq).toBe(101);','+   expect(hasDuplicates(result.events)).toBe(false);','+ });']];
function results(){const w=work();const mobileFiles=['composer.css','viewport.ts'];const mobileDiffs=[['  .composer {','-   position: fixed;','-   bottom: 0;','+   position: sticky;','+   bottom: var(--keyboard-inset, 0px);','+   padding-bottom: env(safe-area-inset-bottom);','  }'],['+ const viewport = window.visualViewport;','+ viewport?.addEventListener("resize", () => {','+   updateVisibleHeight(viewport.height);','+ });']];const shownFiles=current==='c'?mobileFiles:files;const shownDiffs=current==='c'?mobileDiffs:diffs;if(!w.result)return '<div class="empty"><div style="font-size:25px;margin-bottom:12px">▤</div>还没有成果<p style="font-size:12px">产生文件或代码改动后，会显示在这里。</p><button class="outline" onclick="setTab(\'chat\')">返回交流</button></div>';return `<div class="review-head"><div><h2>${current==='c'?'手机输入区域调整':'进度接续'}</h2><small>成果 v1 · 示例差异 · 未提交代码</small></div><span class="spacer"></span>${w.accepted?'<span class="accepted">✓ 已接受成果</span>':`<button class="primary" onclick="acceptResult()" ${w.state==='running'||w.state==='stopping'?'disabled':''}>接受成果</button>`}</div>${w.state==='running'?'<div class="notice">工作仍在进行，以下是当前成果。确认执行停止后才可接受。</div>':''}<p style="font-size:13px;color:#555">${current==='c'?'输入区域适配手机可见窗口，保留发送按钮和补充输入。':'按事件游标继续读取，保留已显示的历史，并过滤重复记录。'}</p><div class="filelist">${shownFiles.map((f,i)=>`<button class="filetab ${i===file?'active':''}" onclick="file=${i};render()">${f}</button>`).join('')}</div><div class="diff"><div class="diff-title"><span>${shownFiles[file]}</span><span style="color:var(--green)">+${file===0?'4':'5'} <span style="color:#b35858">−${file===0?'2':'0'}</span></span></div><pre>${shownDiffs[file].map(line=>`<span class="diff-line ${line.startsWith('+')?'plus':line.startsWith('-')?'minus':''}">${esc(line)}</span>`).join('')}</pre></div><p class="diff-note">此处为交互示意，文件与差异均为示例。接受只记录验收，不会提交或合并代码。</p><button class="outline" onclick="setTab('chat')">← 回到交流，补充修改意见</button>`}
function render(){const w=work();renderList($('app').querySelector('.filter').value);$('title').textContent=w.title;const stateText={running:'正在执行',waiting:'等待你答复',completed:'已完成',stopping:'停止待确认',stopped:'已停止'};const cl=w.state==='waiting'||w.state==='stopping'?'wait':w.state==='completed'?'done':'';$('summary').innerHTML=`<span class="status ${cl}"><i class="dot ${cl}"></i>${stateText[w.state]}</span><span style="color:#d1cfd7">·</span><span>${esc(w.meta)}</span>`;$('chatTab').classList.toggle('active',tab==='chat');$('resultTab').classList.toggle('active',tab==='result');$('chatTab').setAttribute('aria-selected',tab==='chat');$('resultTab').setAttribute('aria-selected',tab==='result');$('resultCount').textContent=w.result?'1':'0';$('content').innerHTML=tab==='chat'?conversation():results();$('composerWrap').classList.toggle('hidden',tab!=='chat');$('stop').classList.toggle('hidden',!['running','waiting','stopping'].includes(w.state));$('stop').disabled=w.state==='stopping';$('stop').textContent=w.state==='stopping'?'停止待确认':'■ 停止工作';$('input').disabled=['stopping','stopped','completed'].includes(w.state);$('send').disabled=$('input').disabled;$('input').placeholder=w.state==='completed'?'查看成果；需要修订时，可创建后续工作。':w.state==='stopping'?'等待执行停止确认…':w.state==='stopped'?'工作已停止，已有内容会保留。':'补充要求，或问问当前进展…';$('inputHelp').textContent=w.state==='completed'?'成果检查后可以接受；接受不会合并代码':'输入不会新建工作'}
function send(){const text=$('input').value.trim();if(!text||$('send').disabled)return;(messages[current]??=[]).push({who:'你',html:'<p>'+esc(text).replace(/\n/g,'<br>')+'</p>'},{who:'Chrona',html:'<p>已收到补充，将保留在当前工作中。这里是交互示意，不会调用真实 Agent。</p>'});$('input').value='';render();$('scroll').scrollTop=$('scroll').scrollHeight}
function answer(text){(messages[current]??=[]).push({who:'你',html:'<p>'+esc(text)+'</p>'});work().state='running';work().meta='已收到答复，继续执行';render();toast('已答复，继续同一项工作')}
function stopWork(){const w=work();if(w.state==='stopping')return;w.state='stopping';w.meta='等待执行停止确认';render();const id=w.id;setTimeout(()=>{const target=works.find(x=>x.id===id);target.state='stopped';target.meta='已有内容已保留';render();toast('示例执行已确认停止')},4500)}
function acceptResult(){work().accepted=true;render();toast('已记录接受成果 · 未提交或合并代码')}
function openNew(){$('newDialog').showModal();setTimeout(()=>$('goal').focus(),30)}
$('newForm').addEventListener('submit',e=>{e.preventDefault();const title=$('goal').value.trim();if(!title)return;const id='new'+Date.now();works.unshift({id,title,state:'running',meta:'目标已收到，准备开始',time:'刚刚',result:false});$('newDialog').close();$('goal').value='';selectWork(id);toast('已创建示例工作，不会执行真实代码')});render();
