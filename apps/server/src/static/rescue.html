<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrona rescue (immutable)</title>
<style>
:root{color-scheme:light dark;font:16px system-ui}body{max-width:800px;margin:auto;padding:20px;overflow-wrap:anywhere}h1{font-size:24px}section{margin:24px 0;border-top:1px solid #888;padding-top:12px}input,button{font:inherit;max-width:100%;box-sizing:border-box;padding:8px}button{margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-bottom:1px solid #888;padding:12px 0}[role=alert]{color:#cf3f4f}
</style>
</head>
<body>
<h1>Chrona rescue (immutable)</h1>
<p>独立恢复控制台：处理审批、暂停或回滚应用。深度修复请在宿主运行 <code>chrona admin</code>；这里不提供对话。</p>
<form id="login"><label>恢复密钥 <input id="key" type="password" autocomplete="off" required></label><button>连接</button></form>
<p id="error" role="alert"></p>
<main hidden id="console">
<button id="refresh">刷新</button>
<section><h2>待处理审批</h2><div id="approvals"></div></section>
<section><h2>应用恢复</h2><p>暂停不会伪造进程已停止；回滚仍执行已有检查和必要审批。</p><div id="modules"></div></section>
</main>
<script>
"use strict";
let key = "";
const el = id => document.getElementById(id);
const node = (tag, text) => { const n = document.createElement(tag); n.textContent = text; return n; };
async function api(path, data) {
  const response = await fetch(path, { method: data ? "POST" : "GET", credentials: "omit", headers: { Authorization: "Bearer " + key, ...(data ? { "Content-Type": "application/json" } : {}) }, ...(data ? { body: JSON.stringify(data) } : {}) });
  const result = await response.json();
  if (!response.ok) throw new Error(result.message || result.code || "请求失败");
  return result;
}
async function run(action) { el("error").textContent = ""; try { await action(); } catch (error) { el("error").textContent = error.message; } }
async function refresh() {
  const [approvals, modules] = await Promise.all([api("/api/approvals"), api("/api/modules")]);
  el("approvals").replaceChildren();
  if (!approvals.items.length) el("approvals").append(node("p", "没有待处理审批。"));
  for (const approval of approvals.items) {
    const article = node("article", "");
    article.append(node("h3", approval.title), node("p", approval.detail));
    if (approval.rescueOnly) article.append(node("p", "只能在恢复控制台处理"));
    const details = node("details", ""); details.append(node("summary", "查看变更与检查记录"), node("pre", approval.preview)); article.append(details);
    for (const [label, decision, scope] of [["允许一次", "approve", "once"], ["始终允许", "approve", "always"], ["拒绝", "deny", "once"]]) {
      const button = node("button", label);
      button.onclick = () => run(async () => { button.disabled = true; try { await api("/api/approvals/" + encodeURIComponent(approval.id) + "/resolve", { decision, scope }); await refresh(); } finally { button.disabled = false; } });
      article.append(button);
    }
    el("approvals").append(article);
  }
  el("modules").replaceChildren();
  if (!modules.items.length) el("modules").append(node("p", "尚未安装应用。"));
  for (const app of modules.items) {
    const article = node("article", ""), path = "/api/modules/" + encodeURIComponent(app.id);
    article.append(node("h3", app.name), node("p", app.status));
    const pause = node("button", "暂停应用"); pause.disabled = app.status === "paused";
    pause.onclick = () => run(async () => { pause.disabled = true; try { await api(path + "/pause", {}); await refresh(); } finally { pause.disabled = app.status === "paused"; } });
    const form = node("form", ""), label = node("label", "回滚到已批准的版本哈希 "), hash = document.createElement("input");
    hash.required = true; hash.maxLength = 200; label.append(hash); form.append(label, node("button", "请求回滚"));
    form.onsubmit = event => { event.preventDefault(); run(async () => { await api(path + "/rollback", { hash: hash.value }); await refresh(); }); };
    article.append(pause, form); el("modules").append(article);
  }
}
el("login").onsubmit = event => { event.preventDefault(); run(async () => { key = el("key").value; el("key").value = ""; await refresh(); el("console").hidden = false; el("login").hidden = true; }); };
el("refresh").onclick = () => run(refresh);
</script>
</body>
</html>
