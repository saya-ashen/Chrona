name: Process native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/process/**'
      - '.github/workflows/process-native-acceptance.yml'

permissions:
  contents: read

jobs:
  process:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Record native runner and revision
        shell: bash
        run: |
          git rev-parse HEAD
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,os:require("node:os").release(),node:process.version})'
          bun --version
      # This package has no external runtime/test dependencies. Do not install
      # the root workspace or silently substitute a mocked OS backend.
      - name: Build host-native helper
        run: bun run --cwd packages/process build:helper
      - name: Native and protocol acceptance
        run: bun test packages/process/src
