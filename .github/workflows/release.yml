name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Audit high and critical dependencies
        run: bun run audit:security

      - run: bunx prisma generate

      - run: bunx prisma db push
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - run: bun run analyze

      - name: Run release tests
        run: bun run test:ci
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          CHRONA_LLM_FIXTURE_MODE: "replay"
          OPENCLAW_MODE: "mock"

      - name: Verify fresh install and previous-release migration paths
        run: bun test packages/db/src/sqlite-migrations.bun.test.ts

  build-binary:
    needs: verify
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bunx prisma generate

      - name: Build binary
        run: bun run chrona build ${{ matrix.target }}
        env:
          VITE_API_BASE_URL: ""

      - name: Smoke test binary
        run: bun run chrona build smoke -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chrona-${{ matrix.target }}
          path: dist/releases/chrona-${{ matrix.target }}.*
          if-no-files-found: error

  create-release:
    needs: build-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/chrona-linux-x64/*
            artifacts/chrona-linux-arm64/*
            artifacts/chrona-darwin-x64/*
            artifacts/chrona-darwin-arm64/*
            artifacts/chrona-windows-x64/*
            artifacts/SHA256SUMS
