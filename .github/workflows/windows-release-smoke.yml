name: Windows Release Smoke

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-release-smoke.yml"
      - ".env.example"
      - "apps/**"
      - "build/**"
      - "external-plugins/**"
      - "features/**"
      - "packages/**"
      - "prisma/**"
      - "scripts/**"
      - "shared/**"
      - "bun.lock"
      - "package.json"
      - "prisma.config.ts"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bunx prisma generate

      - name: Verify source Windows ACL bridge
        run: bun test packages/db/src/sqlite-url.bun.test.ts

      - name: Build Windows binary
        run: bun run chrona build windows-x64
        env:
          VITE_API_BASE_URL: ""

      - name: Smoke test Windows binary
        run: bun run chrona build smoke -- --target windows-x64

      - name: Verify Windows owner-only storage
        run: bun run release:windows-acl-smoke
