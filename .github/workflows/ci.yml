name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bunx prisma generate

      - run: bunx prisma db push
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - run: bun run check
      - name: Install Chromium for result export tests
        run: sudo apt-get update && sudo apt-get install --yes chromium-browser

      - name: Run CI tests
        run: bun run test:ci
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          CHRONA_LLM_FIXTURE_MODE: "replay"
          OPENCLAW_MODE: "mock"

      - name: Verify fresh install and previous-release migration paths
        run: bun test packages/db/src/sqlite-migrations.bun.test.ts

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bunx prisma generate

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E (chromium)
        run: bun run test:e2e:desktop
        env:
          CI: "true"
          DATABASE_URL: "file:./prisma/dev.db"
          OPENCLAW_MODE: "mock"
          CHRONA_LLM_FIXTURE_MODE: "replay"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
