name: CI

on:
  push:
    branches: [main, platform-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # Trusted workspace lifecycle scripts generate Prisma and native runtime artifacts.
      - run: bun install --frozen-lockfile # NOSONAR

      - name: Audit high and critical dependencies
        run: bun run audit:security

      - run: bun run db:generate

      - name: Build source process guardian before runtime checks
        run: bun scripts/chrona.ts build helper

      - name: Smoke documented development entrypoints
        run: bun run smoke:entrypoints
      - name: Types, lint, boundaries and tests on a fresh migrated database
        run: bun run ci:local
        env:
          LINT_RATCHET_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}

      - name: Verify migration and container startup contracts
        run: bun test ./scripts/init-sqlite-current.bun.test.ts ./scripts/docker-entrypoint.bun.test.ts ./scripts/build/release-smoke.bun.test.ts

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build kernel container
        run: docker build --tag chrona-ci .
