name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      # Trusted workspace lifecycle scripts generate Prisma and native runtime artifacts.
      - run: bun install --frozen-lockfile # NOSONAR

      - name: Audit high and critical dependencies
        run: bun run audit:security

      - run: bunx prisma@7.8.0 generate

      - run: bunx prisma@7.8.0 db push
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Smoke documented development entrypoints
        run: bun run smoke:entrypoints
      - run: bun run analyze
      - name: Install Chromium for result export tests
        run: sudo apt-get update && sudo apt-get install --yes chromium-browser

      - name: Run CI tests
        run: bun run test:ci
        env:
          DATABASE_URL: "file:./prisma/dev.db"
          CHRONA_LLM_FIXTURE_MODE: "replay"
          OPENCLAW_MODE: "mock"

      - name: Verify fresh install and previous-release migration paths
        run: bun test packages/db/src/sqlite-migrations.bun.test.ts

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      # Trusted workspace lifecycle scripts generate Prisma and native runtime artifacts.
      - run: bun install --frozen-lockfile # NOSONAR

      - run: bunx prisma@7.8.0 generate

      - name: Install Playwright Chromium
        run: bunx playwright@1.59.1 install --with-deps chromium

      - name: Run Playwright E2E (chromium)
        run: bun run test:e2e:desktop
        env:
          CI: "true"
          DATABASE_URL: "file:./prisma/dev.db"
          OPENCLAW_MODE: "mock"
          CHRONA_LLM_FIXTURE_MODE: "replay"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
